*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0d0b08;overflow:hidden;font-family:'Baloo Tamma 2',sans-serif;color:#fff}

.en-line.show{animation:enIn .9s .35s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes enIn{to{opacity:1;transform:none}}

.kn-line .word .hl{position:absolute;left:0;top:0;width:100%;height:100%;color:var(--bc,#C84B31);clip-path:inset(0 100% 0 0);text-shadow:0 .3vh 0 rgba(255,255,255,.45);pointer-events:none}
.kn-line .word{position:relative}
/* line entrance variants */
.v-rise .word{animation:vRise .62s cubic-bezier(.18,1.35,.32,1) both}
@keyframes vRise{0%{opacity:0;transform:translateY(1.4em) rotateX(55deg) scale(.6)}70%{opacity:1}100%{opacity:1;transform:none}}
.v-pop .word{animation:vPop .6s cubic-bezier(.2,1.7,.4,1) both}

.v-flip .word{animation:vFlip .66s cubic-bezier(.2,1.1,.3,1) both}

@keyframes vWave{0%{opacity:0;transform:translateX(-1.4em) skewX(-24deg)}100%{opacity:1;transform:none}}
