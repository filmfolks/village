<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಊರಂದ್ರೆ ನಮ್ಮೂರು — Lyrical Video</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@700;800;900&family=Noto+Sans+Kannada:wght@700;900&family=Caveat:wght@700&family=Sacramento&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#11100E;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  font-family:'Baloo Tamma 2', sans-serif;
  color:#fff;
  overflow-x:hidden;
}

#stage-container {
  position:relative;
  box-shadow:0 14px 45px rgba(0,0,0,0.65);
  border-radius:12px;
  overflow:hidden;
}

#stage {
  position:relative;
  width:1280px;
  height:720px;
  overflow:hidden;
  background:#F4C89A;
}

/* ===== PLANE 1: BACKGROUND ===== */
#bg {
  position:absolute; inset:0;
  background: radial-gradient(ellipse at 50% 30%, #D8ECF2 0%, #C5E2F0 30%, #F4C89A 70%, #F7D6AD 100%);
  animation: bgDrift 20s ease-in-out infinite;
  transition: background 1.2s ease;
}
@keyframes bgDrift {
  0%,100% { transform:translate(0,0); }
  25%      { transform:translate(-8px,-5px); }
  50%      { transform:translate(6px,8px); }
  75%      { transform:translate(-4px,5px); }
}
.draft-lines {
  position:absolute; inset:0;
  background-image: linear-gradient(rgba(139,90,43,0.055) 1px,transparent 1px),
                    linear-gradient(90deg,rgba(139,90,43,0.055) 1px,transparent 1px);
  background-size:60px 60px;
}

/* ===== CLOUDS ===== */
.cloud { position:absolute; border-radius:50px; pointer-events:none; }
.c1{width:260px;height:85px;left:2%;bottom:190px;background:radial-gradient(ellipse,#fff 60%,#E2EBF0 100%);filter:blur(2px);}
.c2{width:340px;height:95px;left:20%;bottom:205px;background:radial-gradient(ellipse,#fff 60%,#E2EBF0 100%);filter:blur(1.5px);}
.c3{width:300px;height:80px;left:52%;bottom:185px;background:radial-gradient(ellipse,#fff 60%,#E2EBF0 100%);filter:blur(2px);}
.c4{width:240px;height:75px;left:74%;bottom:200px;background:radial-gradient(ellipse,#fff 60%,#E2EBF0 100%);filter:blur(1.5px);}

/* ===== BIRDS ===== */
.bird { position:absolute; animation:birdFly linear infinite; pointer-events:none; }
.bird::before,.bird::after { content:''; position:absolute; border-top:3px solid rgba(74,46,20,0.45); border-radius:50% 50% 0 0; }
.bird::before { width:18px; height:7px; }
.bird::after  { width:14px; height:6px; left:17px; top:1px; }
@keyframes birdFly { from{transform:translateX(-80px) translateY(0);} to{transform:translateX(1360px) translateY(-28px);} }

/* ===== VILLAGE SCENE SVG ===== */
#village-scene {
  position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
  width:1080px; height:320px;
  animation: sceneDrift 24s ease-in-out infinite;
  pointer-events:none;
}
@keyframes sceneDrift {
  0%,100% { transform:translateX(-50%) translateX(0); }
  33%      { transform:translateX(-50%) translateX(-14px); }
  66%      { transform:translateX(-50%) translateX(12px); }
}

/* ===== FOREGROUND CORNER LEAVES ===== */
#leaves-left,#leaves-right {
  position:absolute; top:-20px; width:180px; height:250px; z-index:50; filter:blur(4px); pointer-events:none;
}
#leaves-left  { left:-30px;  animation:leafL 5s ease-in-out infinite alternate; }
#leaves-right { right:-30px; animation:leafR 5s ease-in-out infinite alternate; animation-delay:-2.5s; }
@keyframes leafL { from{transform:rotate(-8deg) translateY(0);} to{transform:rotate(5deg) translateY(14px);} }
@keyframes leafR { from{transform:scaleX(-1) rotate(-8deg) translateY(0);} to{transform:scaleX(-1) rotate(5deg) translateY(14px);} }

/* ===== RACK FOCUS & TRANSITIONS ===== */
#blur-overlay {
  position:absolute; inset:0; z-index:40; pointer-events:none;
  backdrop-filter:blur(0px); transition:backdrop-filter 0.35s ease;
}
#blur-overlay.blurred { backdrop-filter:blur(14px); }

#leaf-wipe { position:absolute; top:-200px; left:-200px; width:300px; height:300px; z-index:45; opacity:0; pointer-events:none; }

/* ===== PLANE 2: KANNADA LYRICS ===== */
#lyric-wrap {
  position:absolute; top:46%; left:50%; transform:translate(-50%,-50%);
  width:92%; text-align:center; z-index:30; pointer-events:none;
}
.kn {
  font-family:'Noto Sans Kannada','Baloo Tamma 2',sans-serif;
  font-weight:900; font-size:58px; line-height:1.32; color:#4A2E14;
  text-shadow: 4px 4px 0 rgba(255,248,235,0.96), 6px 6px 16px rgba(74,46,20,0.25);
  opacity:0; transform:translateY(28px); transition:opacity 0.45s ease, transform 0.45s ease;
}
.kn.in  { opacity:1; transform:translateY(0); }
.kn.out { opacity:0; transform:translateY(-24px); }

.en {
  font-family:'Caveat',cursive; font-weight:700; font-size:28px; color:#FFF7CC;
  text-shadow:1px 1px 6px rgba(139,90,43,0.7), 0 0 20px rgba(245,158,11,0.5);
  margin-top:12px; opacity:0; transition:opacity 0.6s ease 0.2s;
}
.en.in { opacity:1; }

/* ===== SECTION BADGE ===== */
#badge {
  position:absolute; top:24px; left:50%; transform:translateX(-50%);
  border-radius:20px; padding:6px 24px;
  font-family:'Caveat',cursive; font-size:19px; color:#FFF7CC;
  z-index:60; opacity:0; transition:opacity 0.4s;
  background:#C84B31; box-shadow:0 2px 12px rgba(200,75,49,0.4);
}
#badge.show { opacity:1; }

/* ===== PROGRESS BAR ===== */
#pbar {
  position:absolute; bottom:0; left:0; height:6px; width:0%; z-index:70;
  background:linear-gradient(90deg,#C84B31,#F59E0B);
  box-shadow:0 0 10px rgba(245,158,11,0.7);
  transition:width 0.15s linear;
}

/* ===== LOAD SCREEN OVERLAY ===== */
#load-screen {
  position:absolute; inset:0; z-index:100;
  background:linear-gradient(135deg,#F4C89A 0%,#D8ECF2 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
}
#load-screen h1 {
  font-family:'Noto Sans Kannada',sans-serif; font-size:52px; font-weight:900;
  color:#4A2E14; text-shadow:3px 3px 0 rgba(255,248,235,0.9); text-align:center;
}
#load-screen p { font-family:'Caveat',cursive; font-size:24px; color:#7A4E2D; text-align:center; }
.btn-primary {
  background:#C84B31; color:#FFF7CC; border:none; border-radius:50px; padding:16px 40px;
  font-family:'Baloo Tamma 2',sans-serif; font-size:18px; font-weight:800; cursor:pointer;
  box-shadow:0 4px 20px rgba(200,75,49,0.4); transition:all 0.2s ease;
}
.btn-primary:hover { transform:scale(1.05); box-shadow:0 6px 26px rgba(200,75,49,0.6); }

/* ===== BOTTOM TOOLBAR ===== */
#toolbar {
  width:1280px;
  margin-top:14px;
  background:#1E1C1A;
  border:1px solid #332E2A;
  border-radius:12px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  font-size:14px;
}
.tool-group { display:flex; align-items:center; gap:12px; }
.btn-tool {
  background:#2E2A27; color:#E5D5C5; border:1px solid #4D4540; border-radius:8px;
  padding:8px 16px; font-family:'Baloo Tamma 2',sans-serif; font-weight:700;
  font-size:14px; cursor:pointer; transition:all 0.15s;
}
.btn-tool:hover { background:#3E3834; color:#fff; }
.btn-tool.active { background:#C84B31; color:#fff; border-color:#C84B31; }

.offset-control {
  display:flex; align-items:center; gap:8px; background:#141210; padding:4px 12px; border-radius:8px; border:1px solid #332E2A;
}
.offset-btn {
  background:#C84B31; color:#fff; border:none; border-radius:4px; width:26px; height:26px; font-weight:900; cursor:pointer;
}

/* ===== LIVE LYRIC TIMELINE EDITOR PANEL ===== */
#timeline-panel {
  width:1280px;
  margin-top:14px;
  background:#1A1816;
  border:1px solid #332E2A;
  border-radius:12px;
  padding:16px 20px;
  max-height:260px;
  overflow-y:auto;
  display:none;
}
#timeline-panel.visible { display:block; }
.timeline-row {
  display:grid;
  grid-template-columns: 50px 100px 1fr 140px;
  align-items:center;
  gap:12px;
  padding:8px 12px;
  border-bottom:1px solid #282421;
  font-size:14px;
}
.timeline-row.active { background:rgba(200,75,49,0.18); border-radius:6px; }
.time-input {
  background:#0D0C0B; border:1px solid #4D4540; color:#F59E0B;
  border-radius:4px; padding:4px 8px; font-family:monospace; font-size:13px; width:80px; text-align:center;
}
</style>
</head>

  'ಏ ಗಡಿಬಿಡಿ Hook': { bg:'radial-gradient(ellipse at 50% 30%,#FFF3CD 0%,#FFE580 30%,#F4C89A 70%,#F7D6AD 100%)', tc:'#4A2E14', bc:'#F59E0B' },
  'ಇಂಟರ್‌ಲ್ಯೂಡ್':    { bg:'radial-gradient(ellipse at 50% 30%,#F7D6AD 0%,#E2D4C5 30%,#F4C89A 70%,#D8ECF2 100%)', tc:'#5C3A1E', bc:'#7A4E2D' },
  'ಚರಣ':           { bg:'radial-gradient(ellipse at 50% 30%,#D8F0E2 0%,#B8E8CC 30%,#F4C89A 70%,#F7D6AD 100%)', tc:'#1A3A10', bc:'#3B7A23' },
  'ಔಟ್ರೋ':          { bg:'radial-gradient(ellipse at 50% 30%,#F4E0C8 0%,#F0D0A0 30%,#C84B31 90%,#A63828 100%)', tc:'#FFF7CC', bc:'#F59E0B' }
};

// Clear any old stored inaccurate cues to guarantee audio-extracted timings take effect
localStorage.removeItem('oorandre_cues');
let cues = JSON.parse(JSON.stringify(WHISPER_CUES));
let globalOffset = 0.0;

const player = document.getElementById('media-player');
const knEl   = document.getElementById('kn');
const enEl   = document.getElementById('en');
const bdg    = document.getElementById('badge');
const bgEl   = document.getElementById('bg');
const blurEl = document.getElementById('blur-overlay');
const pbar   = document.getElementById('pbar');
const timeText = document.getElementById('time-text');
const offsetDisp = document.getElementById('offset-display');
const playBtn = document.getElementById('play-btn');

let activeCueIdx = -1;

function updateOffsetDisplay() {
  offsetDisp.textContent = (globalOffset >= 0 ? '+' : '') + globalOffset.toFixed(2) + 's';
}
updateOffsetDisplay();

function nudgeGlobalOffset(delta) {
  globalOffset = parseFloat((globalOffset + delta).toFixed(2));
  updateOffsetDisplay();
}

function resetToWhisperDefaults() {
  cues = JSON.parse(JSON.stringify(WHISPER_CUES));
  globalOffset = 0.0;
  updateOffsetDisplay();
  buildTimelineRows();
  alert('Reset to exact audio-detected timings!');
}

function loadMedia(event) {
  const f = event.target.files[0];
  if (!f) return;
  player.src = URL.createObjectURL(f);
  player.load();
  document.getElementById('load-screen').style.display = 'none';
  player.play().catch(e => console.log('Autoplay deferred:', e));
  buildTimelineRows();
}

player.addEventListener('timeupdate', () => {
  const t = player.currentTime;
  const adjTime = t - globalOffset;

  if (player.duration) {
    pbar.style.width = (t / player.duration * 100) + '%';
    timeText.textContent = fmt(t) + ' / ' + fmt(player.duration);
  }

  // Find cue
  let found = -1;
  for (let i = 0; i < cues.length; i++) {
    if (adjTime >= cues[i].start && adjTime < cues[i].end) {
      found = i;
      break;
    }
  }

  if (found !== activeCueIdx) {
    displayCue(found);
    activeCueIdx = found;
    highlightTimelineRow(found);
  }
});

function displayCue(idx) {
  blurEl.classList.add('blurred');
  setTimeout(() => {
    blurEl.classList.remove('blurred');
    if (idx === -1) {
      knEl.className = 'kn';
      enEl.className = 'en';
      bdg.className = 'badge';
      return;
    }

    const c = cues[idx];
    const theme = THEMES[c.s] || THEMES['ಪಲ್ಲವಿ'];
    bgEl.style.background = theme.bg;
    knEl.style.color = theme.tc;
    bdg.style.background = theme.bc;

    knEl.innerHTML = c.kn.replace(/\n/g, '<br>');
    enEl.innerHTML = c.en.replace(/\n/g, '<br>');
    bdg.textContent = c.s;

    knEl.className = 'kn';
    enEl.className = 'en';
    bdg.className = 'badge';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        knEl.classList.add('in');
        enEl.classList.add('in');
        bdg.classList.add('show');
      });
    });

    if (idx === 0 || (idx > 0 && cues[idx].s !== cues[idx-1].s)) {
      triggerLeafWipe();
    }
  }, 300);

  knEl.classList.add('out');
  enEl.classList.remove('in');
}

function triggerLeafWipe() {
  const leaf = document.getElementById('leaf-wipe');
  leaf.style.transition = 'none';
  leaf.style.top = '-200px';
  leaf.style.left = '-200px';
  leaf.style.opacity = '1';
  leaf.style.transform = 'rotate(-40deg) scale(1.6)';
  setTimeout(() => {
    leaf.style.transition = 'top 1.1s ease, left 1.1s ease, opacity 0.3s ease 0.85s';
    leaf.style.top = '820px';
    leaf.style.left = '1420px';
    setTimeout(() => { leaf.style.opacity = '0'; }, 850);
  }, 50);
}

// Media Controls
function togglePlay() {
  if (player.paused) {
    player.play();
    playBtn.textContent = '⏸ Pause';
  } else {
    player.pause();
    playBtn.textContent = '▶ Play';
  }
}

function seekRelative(sec) {
  player.currentTime = Math.max(0, Math.min(player.duration || 161, player.currentTime + sec));
}

function toggleFS() {
  const s = document.getElementById('stage');
  if (!document.fullscreenElement) {
    s.requestFullscreen?.() || s.webkitRequestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

// Spacebar controls play/pause
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  }
});

function fmt(s) {
  s = s || 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

// ================================================================
// LIVE TIMELINE INSPECTOR & TUNER
// ================================================================
function toggleTimelinePanel() {
  const p = document.getElementById('timeline-panel');
  const btn = document.getElementById('timeline-toggle-btn');
  p.classList.toggle('visible');
  btn.classList.toggle('active');
  if (p.classList.contains('visible')) buildTimelineRows();
}

function buildTimelineRows() {
  const container = document.getElementById('timeline-rows');
  container.innerHTML = '';
  cues.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'timeline-row';
    row.id = 'trow-' + i;
    row.innerHTML = `
      <span style="color:#777;">#${i+1}</span>
      <input type="number" step="0.1" class="time-input" value="${c.start}" onchange="updateCueTime(${i}, 'start', this.value)">
      <div style="font-size:13px; color:#E5D5C5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${c.kn.split('\n')[0]}</div>
      <div style="display:flex; gap:6px;">
        <button class="btn-tool" style="padding:2px 8px; font-size:11px;" onclick="jumpToCue(${i})">▶ Go</button>
        <button class="btn-tool" style="padding:2px 8px; font-size:11px;" onclick="setStartToCurrent(${i})">⏱ Set Now</button>
      </div>
    `;
    container.appendChild(row);
  });
}

function updateCueTime(idx, key, val) {
  cues[idx][key] = parseFloat(val);
}

function setStartToCurrent(idx) {
  cues[idx].start = parseFloat((player.currentTime - globalOffset).toFixed(2));
  if (idx > 0) cues[idx-1].end = cues[idx].start;
  buildTimelineRows();
  localStorage.setItem('oorandre_cues', JSON.stringify(cues));
}

function jumpToCue(idx) {
  player.currentTime = cues[idx].start + globalOffset;
}

function highlightTimelineRow(idx) {
  document.querySelectorAll('.timeline-row').forEach(r => r.classList.remove('active'));
  const target = document.getElementById('trow-' + idx);
  if (target) {
    target.classList.add('active');
    target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function saveCustomTimings() {
  localStorage.setItem('oorandre_cues', JSON.stringify(cues));
  alert('Custom cue timings saved!');
}
</script>
